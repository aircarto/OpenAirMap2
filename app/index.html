<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>OpenAirMap</title>
        <!-- favicon -->
        <link
            rel="shortcut icon"
            type="image/x-icon"
            href="https://aircarto.fr/images/favicon.ico"
        />
        <!-- Leaflet -->
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css"
            integrity="sha256-kLaT2GOSpHechhsozzB+flnD+zUyjE2LlfWPgU04xyI="
            crossorigin=""
        />
        <script
            src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"
            integrity="sha256-WBkoXOwTeyKclOHuWtc+i2uENFpDZ9YPdf5Hf+D7ewM="
            crossorigin=""
        ></script>

        <!-- JS FILES -->
        <!-- AM CHARTS -->
        <script src="https://cdn.amcharts.com/lib/5/locales/fr_FR.js"></script>
        <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
        <script src="https://cdn.amcharts.com/lib/5/xy.js"></script>
        <script src="https://cdn.amcharts.com/lib/5/radar.js"></script>
        <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>
        <script src="https://cdn.amcharts.com/lib/5/plugins/exporting.js"></script>
        <!-- canvasjs -->
        <script
            type="text/javascript"
            src="https://cdn.canvasjs.com/canvasjs.min.js"
        ></script>
        <!-- Cookies -->
        <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js"></script>
        <!-- BOOTSTRATP -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        />
        <!-- AJAX -->
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
        <!-- SweetAlert2 -->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
        />
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <!-- PlainDraggable -->
         <script src="https://cdn.jsdelivr.net/npm/plain-draggable@2.5.15/plain-draggable.min.js"></script>
        <!-- style CSS  -->
        <link rel="stylesheet" href="css/sources.css" />
        <link rel="stylesheet" href="style/style.css" />
        <link rel="stylesheet" href="css/signalair.css" />
    </head>
    <body>
        <!-- NavBar  -->
        <nav class="navbar navbar-expand-lg fixed-top" id="nav-bar">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">OpenAirMap</a>
                <img src="img/logo_atmosud_inspirer_ok_web.png" height="40" alt="Logo atmoSud" />


                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="offcanvas"
                    data-bs-target="#offcanvasNavbar"
                    aria-controls="offcanvasNavbar"
                    aria-label="Toggle navigation"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div
                    class="offcanvas offcanvas-end"
                    tabindex="-1"
                    id="offcanvasNavbar"
                    aria-labelledby="offcanvasNavbarLabel"
                >
                    <div class="offcanvas-header">
                        <h5 class="offcanvas-title" id="offcanvasNavbarLabel">
                            Menu
                        </h5>
                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="offcanvas"
                            aria-label="Close"
                        ></button>
                    </div>

                    <div class="offcanvas-body">
                        <ul
                            class="navbar-nav justify-content-end flex-grow-1 pe-3"
                        >
                            
                            <!-- Mesure -->
                            <li class="nav-item dropdown ms-2 mb-1">
                                <a
                                    class="btn btn-secondary dropdown-toggle"
                                    href="#"
                                    role="button"
                                    data-bs-toggle="dropdown"
                                    data-bs-auto-close="outside"
                                    aria-expanded="false"
                                >
                                    <span class="selected-option"
                                        >Choisir un polluant</span
                                    >
                                </a>
                                <ul
                                    class="dropdown-menu"
                                    id="dropdown_mesures"
                                ></ul>
                            </li>
                            <!-- Sources -->
                            <li class="nav-item dropdown ms-2 mb-1">
                                <a
                                    class="btn btn-secondary dropdown-toggle"
                                    href="#"
                                    role="button"
                                    data-bs-toggle="dropdown"
                                    data-bs-auto-close="outside"
                                    aria-expanded="false"
                                >
                                    Sources de données
                                </a>
                                <ul
                                    class="dropdown-menu"
                                    id="dropdown_sources"
                                ></ul>
                            </li>

                            <!-- Pas de temps -->
                            <li class="nav-item dropdown ms-2 mb-1">
                                <a
                                    class="btn btn-secondary dropdown-toggle"
                                    href="#"
                                    role="button"
                                    data-bs-toggle="dropdown"
                                    data-bs-auto-close="outside"
                                    aria-expanded="false"
                                >
                                    <span class="selected-option"
                                        >Choisir un pas de temps</span
                                    >
                                </a>
                                <ul
                                    class="dropdown-menu"
                                    id="dropdown_pas_de_temps"
                                ></ul>
                            </li>

                            <!-- Modélisation-->
                            <li class="nav-item dropdown ms-2 mb-1">
                                <a
                                    class="btn btn-secondary dropdown-toggle"
                                    href="#"
                                    role="button"
                                    data-bs-toggle="dropdown"
                                    data-bs-auto-close="outside"
                                    aria-expanded="false"
                                >
                                    <span
                                        class="selected-option"
                                        id="modelisation-selected-option"
                                        >Cartes de modélisation</span
                                    >
                                </a>
                                <ul
                                    class="dropdown-menu"
                                    id="dropdown_modelisations"
                                ></ul>
                            </li>
                            <!-- Horloge -->
                            <li class="nav-item ms-2 mb-1">
                                <span
                                    id="button_horloge"
                                    class="btn btn-outline-secondary"
                                ></span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
        <!-- Fin Navbar -->

        <div class="row align-items-start">
            <!-- SIDE PANEL  -->
            <div
                class="vh-100 overflow-auto"
                id="side-panel"
                style="display: none; padding-left: 20px"
            >
                <button
                    class="btn btn-outline-secondary d-sm-none"
                    id="closeSidePanelMobile"
                    style="
                        position: absolute;
                        top: 10px;
                        right: 80px;
                        z-index: 1200;
                    "
                >
                    <i class="bi bi-map"></i>
                </button>
                <button
                    class="btn btn-outline-primary position-absolute m-3"
                    id="reduceSidePanel"
                    style="
                        left: 20px;
                        top: calc(50% + 100px);
                        z-index: 1100;
                        background-color: white;
                        border: none;
                        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
                        transition: all 0.3s ease;
                        padding: 8px 12px;
                        border-radius: 50%;
                        transform: translateY(-50%);
                        display: none;
                    "
                >
                    <i class="bi bi-chevron-left"></i>
                </button>
                <div
                    class="row ms-1 me-2"
                    style="margin-top: 50px; margin-bottom: 50px"
                >
                    <!-- CARD 3 : Graphs -->
                    <div class="col-sm-12">
                        <div class="card" id="card3">
                            <div class="card-body">
                                <!-- Bouton pour afficher/masquer les polluants -->
                                <div class="text-center mt-2">
                                    <div
                                        class="d-flex justify-content-center align-items-center gap-3"
                                    >
                                        <button
                                            class="btn btn-outline-primary btn-sm"
                                            type="button"
                                            id="togglePollutants"
                                        >
                                            <i class="bi bi-chevron-down"></i>
                                            Afficher les polluants
                                        </button>
                                        <div class="btn-group" role="group">
                                            <button
                                                class="btn btn-outline-secondary btn-sm"
                                                id="toggleYAxisCapping"
                                                data-bs-toggle="tooltip"
                                                data-bs-placement="left"
                                                data-bs-title="Activer/désactiver la limite de l'axe Y"
                                            >
                                                <i class="bi bi-graph-up"></i>
                                                Limiter axe Y
                                            </button>
                                            <input
                                                type="number"
                                                class="form-control form-control-sm"
                                                id="yAxisMaxValue"
                                                placeholder="Max"
                                                style="width: 80px"
                                                min="1"
                                                value="90"
                                            />
                                        </div>
                                    </div>
                                </div>
                                <!-- Polluants -->
                                <div
                                    class="btn-group btn-group-sm mt-2"
                                    id="btn_polluants"
                                    role="group"
                                    aria-label="Basic radio toggle button group"
                                    style="display: none"
                                >
                                    <input
                                        type="checkbox"
                                        class="btn-check"
                                        name="btn_poluant_pm1"
                                        id="btn_poluant_pm1"
                                        autocomplete="off"
                                    />
                                    <label
                                        class="btn btn-outline-primary"
                                        for="btn_poluant_pm1"
                                        >PM<sub>1</sub></label
                                    >

                                    <input
                                        type="checkbox"
                                        class="btn-check"
                                        name="btn_poluant_pm25"
                                        id="btn_poluant_pm25"
                                        autocomplete="off"
                                    />
                                    <label
                                        class="btn btn-outline-primary"
                                        for="btn_poluant_pm25"
                                        >PM<sub>2.5</sub></label
                                    >

                                    <input
                                        type="checkbox"
                                        class="btn-check"
                                        name="btn_poluant_pm10"
                                        id="btn_poluant_pm10"
                                        autocomplete="off"
                                    />
                                    <label
                                        class="btn btn-outline-primary"
                                        for="btn_poluant_pm10"
                                        >PM<sub>10</sub></label
                                    >

                                    <input
                                        type="checkbox"
                                        class="btn-check"
                                        name="btn_poluant_no2"
                                        id="btn_poluant_no2"
                                        autocomplete="off"
                                    />
                                    <label
                                        class="btn btn-outline-primary"
                                        for="btn_poluant_no2"
                                        >NO<sub>2</sub></label
                                    >

                                    <input
                                        type="checkbox"
                                        class="btn-check"
                                        name="btn_poluant_so2"
                                        id="btn_poluant_so2"
                                        autocomplete="off"
                                    />
                                    <label
                                        class="btn btn-outline-primary"
                                        for="btn_poluant_so2"
                                        >SO<sub>2</sub></label
                                    >

                                    <input
                                        type="checkbox"
                                        class="btn-check"
                                        name="btn_poluant_o3"
                                        id="btn_poluant_o3"
                                        autocomplete="off"
                                    />
                                    <label
                                        class="btn btn-outline-primary"
                                        for="btn_poluant_o3"
                                        >O<sub>3</sub></label
                                    >

                                    <input
                                        type="checkbox"
                                        class="btn-check"
                                        name="btn_poluant_nh3"
                                        id="btn_poluant_nh3"
                                        autocomplete="off"
                                    />
                                    <label
                                        class="btn btn-outline-primary"
                                        for="btn_poluant_nh3"
                                        >NH<sub>3</sub></label
                                    >

                                    <input
                                        type="checkbox"
                                        class="btn-check"
                                        name="btn_poluant_h2s"
                                        id="btn_poluant_h2s"
                                        autocomplete="off"
                                    />
                                    <label
                                        class="btn btn-outline-primary"
                                        for="btn_poluant_h2s"
                                        >H<sub>2</sub>S</label
                                    >

                                    <input
                                        type="checkbox"
                                        class="btn-check"
                                        name="btn_poluant_c6h6"
                                        id="btn_poluant_c6h6"
                                        autocomplete="off"
                                    />
                                    <label
                                        class="btn btn-outline-primary"
                                        for="btn_poluant_c6h6"
                                        >C<sub>6</sub>H<sub>6</sub></label
                                    >
                                </div>
                                <!-- CHART -->
                                <div id="chartdiv_sensor"></div>

                                <!-- historique -->
                                <div class="text-center">
                                    <div
                                        class="btn-group btn-group-sm mt-1"
                                        role="group"
                                        aria-label="Basic radio toggle button group"
                                    >
                                        <span class="btn-group-title"
                                            >Historique</span
                                        >
                                        <input
                                            type="radio"
                                            class="btn-check"
                                            name="btn_historique_3h"
                                            id="btn_historique_3h"
                                            autocomplete="off"
                                        />
                                        <label
                                            class="btn btn-outline-primary"
                                            for="btn_historique_3h"
                                            >3 h</label
                                        >

                                        <input
                                            type="radio"
                                            class="btn-check"
                                            name="btn_historique_24h"
                                            id="btn_historique_24h"
                                            autocomplete="off"
                                        />
                                        <label
                                            class="btn btn-outline-primary"
                                            for="btn_historique_24h"
                                            >24 h</label
                                        >

                                        <input
                                            type="radio"
                                            class="btn-check"
                                            name="btn_historique_7d"
                                            id="btn_historique_7d"
                                            autocomplete="off"
                                        />
                                        <label
                                            class="btn btn-outline-primary"
                                            for="btn_historique_7d"
                                            >7 j</label
                                        >
                                        <input
                                            type="radio"
                                            class="btn-check"
                                            name="btn_historique_365d"
                                            id="btn_historique_365d"
                                            autocomplete="off"
                                        />
                                        <label
                                            class="btn btn-outline-primary"
                                            for="btn_historique_365d"
                                            >1 an</label
                                        >
                                    </div>

                                    <!-- Pas de temps -->
                                    <div
                                        class="btn-group btn-group-sm mt-1"
                                        role="group"
                                        aria-label="Basic radio toggle button group"
                                    >
                                        <span class="btn-group-title"
                                            >Pas de temps</span
                                        >

                                        <input
                                            type="radio"
                                            class="btn-check"
                                            name="btn_pas_de_temps_scan"
                                            id="btn_pas_de_temps_scan"
                                            autocomplete="off"
                                        />
                                        <label
                                            class="btn btn-outline-primary"
                                            for="btn_pas_de_temps_scan"
                                            >scan</label
                                        >

                                        <input
                                            type="radio"
                                            class="btn-check"
                                            name="btn_pas_de_temps_qh"
                                            id="btn_pas_de_temps_qh"
                                            autocomplete="off"
                                        />
                                        <label
                                            class="btn btn-outline-primary"
                                            for="btn_pas_de_temps_qh"
                                            >15 min</label
                                        >

                                        <input
                                            type="radio"
                                            class="btn-check"
                                            name="btn_pas_de_temps_h"
                                            id="btn_pas_de_temps_h"
                                            autocomplete="off"
                                        />
                                        <label
                                            class="btn btn-outline-primary"
                                            for="btn_pas_de_temps_h"
                                            >1 h</label
                                        >

                                        <input
                                            type="radio"
                                            class="btn-check"
                                            name="btn_pas_de_temps_d"
                                            id="btn_pas_de_temps_d"
                                            autocomplete="off"
                                        />
                                        <label
                                            class="btn btn-outline-primary"
                                            for="btn_pas_de_temps_d"
                                            >1 j</label
                                        >
                                    </div>

                                    <!-- Plage historique -->
                                    <div class="mt-2">
                                        <button
                                            class="btn btn-outline-primary btn-sm"
                                            type="button"
                                            data-bs-toggle="collapse"
                                            data-bs-target="#dateRangeForm"
                                            aria-expanded="false"
                                            aria-controls="dateRangeForm"
                                        >
                                            <i class="bi bi-calendar-range"></i>
                                            Plage de dates personnalisée
                                        </button>

                                        <div
                                            class="collapse mt-2"
                                            id="dateRangeForm"
                                        >
                                            <form>
                                                <div class="row g-2">
                                                    <div class="col-md-6">
                                                        <label
                                                            for="start_date"
                                                            class="form-label"
                                                            >Date de début
                                                            :</label
                                                        >
                                                        <input
                                                            class="form-control"
                                                            type="date"
                                                            id="start_date"
                                                            name="start_date"
                                                            required
                                                        />
                                                    </div>
                                                    <div class="col-md-6">
                                                        <label
                                                            for="end_date"
                                                            class="form-label"
                                                            >Date de fin
                                                            :</label
                                                        >
                                                        <input
                                                            class="form-control"
                                                            type="date"
                                                            id="end_date"
                                                            name="end_date"
                                                            required
                                                        />
                                                    </div>
                                                    <div
                                                        class="col-12 text-center"
                                                    >
                                                        <button
                                                            class="btn btn-primary"
                                                            type="button"
                                                            id="apply_date_range"
                                                        >
                                                            Appliquer
                                                        </button>
                                                    </div>
                                                </div>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- CARD 1 : PHOTO -->
                    <div class="col-sm-6 mt-3">
                        <div class="card h-100" id="card1">
                            <img
                                id="card1_img"
                                src=""
                                class="card-img-top"
                                alt="..."
                            />
                            <div class="card-body" id="card_1_body">
                                <h5 class="card-title" id="card1_title"></h5>
                                <h6
                                    class="card-subtitle mb-2 text-body-secondary"
                                    id="card1_subtitle"
                                ></h6>
                                <p class="card-text" id="card1_text"></p>
                            </div>
                        </div>
                    </div>

                    <!-- CARD 2: TEXT  -->
                    <div class="col-sm-6 mt-3">
                        <div class="card" id="card2">
                            <div class="card-body">
                                <h5 class="card-title" id="card2_title"></h5>
                                <h6
                                    class="card-subtitle mb-2 text-body-secondary"
                                    id="card2_subtitle"
                                ></h6>
                                <p class="card-text" id="card2_text"></p>
                                <a href="" id="card2_link"></a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- MAP  -->
            <div class="col-12" id="map-container">
                <button
                    class="btn btn-outline-primary position-absolute m-3"
                    id="toggleSidePanel"
                    style="
                        left: 20px;
                        top: 50%;
                        z-index: 1100;
                        background-color: white;
                        border: none;
                        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
                        transition: all 0.3s ease;
                        padding: 8px 12px;
                        border-radius: 50%;
                        transform: translateY(-50%);
                    "
                >
                    <i class="bi bi-chevron-right"></i>
                </button>
                <button
                    class="btn btn-outline-primary position-absolute m-3"
                    id="collapseSidePanel"
                    style="
                        left: 20px;
                        top: calc(50% + 50px);
                        z-index: 1100;
                        background-color: white;
                        border: none;
                        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
                        transition: all 0.3s ease;
                        padding: 8px 12px;
                        border-radius: 50%;
                        transform: translateY(-50%);
                        display: none;
                    "
                >
                    <i class="bi bi-chevron-left"></i>
                </button>
                <div id="map"></div>

                <!-- Seuils -->
                <div
                    class="btn-group btn-group-sm"
                    id="div_button_seuils_"
                    role="group"
                >
                    <button
                        class="btn"
                        id="btn_default"
                        data-bs-toggle="tooltip"
                        data-bs-placement="bottom"
                        data-bs-title="pas de donnée pour ce type de particule / ce pas de temps"
                    >
                        Pas de donnée
                    </button>
                    <button
                        class="btn"
                        id="btn_bon"
                        data-bs-toggle="tooltip"
                        data-bs-placement="bottom"
                        data-bs-title="0 à 10 &#181;g/m&#179;"
                    >
                        Bon
                    </button>
                    <button
                        class="btn"
                        id="btn_moyen"
                        data-bs-toggle="tooltip"
                        data-bs-placement="bottom"
                        data-bs-title="11 à 20 &#181;g/m&#179;"
                    >
                        Moyen
                    </button>
                    <button
                        class="btn"
                        id="btn_degrade"
                        data-bs-toggle="tooltip"
                        data-bs-placement="bottom"
                        data-bs-title="21 à 25 &#181;g/m&#179;"
                    >
                        Dégradé
                    </button>
                    <button
                        class="btn"
                        id="btn_mauvais"
                        data-bs-toggle="tooltip"
                        data-bs-placement="bottom"
                        data-bs-title="26 à 50 &#181;g/m&#179;"
                    >
                        Mauvais
                    </button>
                    <button
                        class="btn"
                        id="btn_tres_mauvais"
                        data-bs-toggle="tooltip"
                        data-bs-placement="bottom"
                        data-bs-title="51 à 75 &#181;g/m&#179;"
                    >
                        Très mauvais
                    </button>
                    <button
                        class="btn"
                        id="btn_extr_mauvais"
                        data-bs-toggle="tooltip"
                        data-bs-placement="bottom"
                        data-bs-title="> 75 &#181;g/m&#179;"
                    >
                        Extrêmement mauvais
                    </button>
                </div>
            </div>
            <!-- end map-container -->
        </div>

        <!-- JAVASCRIPT -->
        <script type="module" src="app.js"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"
        ></script>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
            integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
            crossorigin="anonymous"
        ></script>
        <script>
            //Bootstrap variable for using tooltips
            const tooltipTriggerList = document.querySelectorAll(
                '[data-bs-toggle="tooltip"]'
            );
            const tooltipList = [...tooltipTriggerList].map(
                (tooltipTriggerEl) => new bootstrap.Tooltip(tooltipTriggerEl)
            );
        </script>
    </body>
</html>
